name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = la VM del bot (Ubuntu 22.04); 3.12 = Streamlit Community Cloud (runtime.txt)
        python-version: ["3.10", "3.12"]
    env:
      # Los tests usan SQLite en memoria y no tocan Telegram, Supabase ni Gemini.
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
